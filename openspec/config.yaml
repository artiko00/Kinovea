schema: spec-driven

context: |
  Project: Kinovea, an open source (GPLv2) Windows desktop video annotation tool for
  motion analysis (capture, playback, slow motion, comparison, drawings, measurements).
  This repository is the fork artiko00/Kinovea of Kinovea/Kinovea.

  Stack (verified from project files):
  - C# on .NET Framework 4.8 with WinForms; 20 old-style .csproj using packages.config.
  - One C++/CLI project (Kinovea.Video.FFMpeg/PlayerServer) binding FFmpeg 8.1.2.
  - NuGet: log4net 2.0.14, OpenCvSharp4 4.10.0, MathNet.Numerics 5.0.0, Newtonsoft.Json 13.0.3,
    OxyPlot 1.0.0, SharpVectors 1.8.5, DocumentFormat.OpenXml 3.0.2, NAudio 2.2.1, ObjectListView 2.9.1.
  - Solution: Kinovea.VS2019.sln (22 projects). Build: msbuild, Platform=x64, Configuration=Release.
  - Build and installer (NSIS 3.11) run only on Windows; CI is .github/workflows/build.yml.
  - The agent host is Linux: no local compilation. Verification happens in CI.

  Architecture (see architecture.md):
  - Kinovea: entry point, main window, menus, preferences.
  - Kinovea.ScreenManager: player/capture screens, keyframes, drawings, measurements, calibration, tracking.
  - Kinovea.FileBrowser: left panel. Kinovea.Services: shared types (preferences, shortcuts, undo, workspaces).
  - Kinovea.Video*: video reader plugins loaded from a static list; Kinovea.Pipeline: capture pipeline.
  - Kinovea.Camera*: camera managers; machine-vision plugins are discovered dynamically.

  Testing and validation:
  - No automated test framework. Kinovea.Tests is a manual console harness outside the .sln.
  - Quality gates: open-harness linters (linelens, dupelens, secretlens, testlens) via lefthook pre-commit.

  Conventions and design decisions:
  - Follow AGENTS.md. 4-space indentation, Microsoft C# conventions, log4net static logger per class.
  - *.Designer.cs and *.resx are generated by the WinForms designer; translated .resx come from Weblate and are never edited by hand.
  - Commits: atomic, prefixed feat:/fix:/refactor:, no Co-Authored-By.
  - Changes to Kinovea.targets, workflows, Installer/, Refs/ and the C++/CLI project require explicit approval.

  Domain terms:
  - KVA: Kinovea Video Annotation file (XML) storing keyframes, drawings and measurements.
  - Keyframe: annotated frame. Drawing: annotation object (line, angle, chrono, track, posture...).
  - Working zone: frame range loaded in memory for playback. Calibration: pixel-to-world mapping.
  - Capture screen vs player screen; dual screens allow synchronized comparison.

rules:
  proposal:
    - Keep proposals under 500 words
    - Always include a "Non-goals" section
    - State which assemblies are touched and whether CI build is the only verification available
  specs:
    - Write requirements as testable statements even though automated tests do not exist yet
    - Name the UI entry point (menu, dialog, shortcut) for every user-facing requirement
  design:
    - Prefer extending existing patterns in Kinovea.ScreenManager over new abstractions
    - Call out any new NuGet or native dependency as a decision requiring approval
    - Mention impact on KVA file format and backward compatibility when metadata changes
  tasks:
    - Break tasks into chunks of max 2 hours
    - Each task names the files to touch and ends with a verification step (lint, CI build, manual check on Windows)
    - Add an English .resx string task whenever UI text is introduced
