[workspace]
resolver = "2"
members = [
    "kinovea-core",
    "kinovea-geometry",
    "kinovea-kinematics",
    "kinovea-measurement",
    "kinovea-metadata",
    "kinovea-render",
    "kinovea-video",
    "kinovea-tracking",
    "kinovea-export",
    "kinovea-fixtures",
    "kinovea",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
repository = "https://github.com/artiko00/Kinovea"
rust-version = "1.93"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
